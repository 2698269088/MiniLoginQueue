# MiniLoginQueue English language file

messages:
  # General
  manual-queue-hint: "&a[Login Queue] &fLeft-click the \"Join Game\" button in your hotbar, or use &e/join&f to join the queue"
  entering: "&a[Login Queue] &fYou may enter! Transferring you to server &e{server}&f ..."
  server-offline: "&c[Login Queue] &fServer &e{server}&f is currently offline or unreachable, please try again later"
  server-unknown: "&e[Login Queue] &fChecking the status of server &e{server}&f, please try again in a moment..."
  unknown-server: "&c[Login Queue] &fTarget server &e{server}&f was not found in the configuration"
  server-removed: "&c[Login Queue] &fTarget server &e{server}&f has been removed from the configuration, please join the queue again"
  waiting: "&a[Login Queue] &fYou are now queued for &e{server}&f, position &e{position}&f. Server online: &e{online}&f/&e{max}&f. Please wait patiently..."
  already-in-queue: "&c[Login Queue] &fYou are already queued for &e{server}&f. Use &e/mlq leave&f first to switch servers"
  not-in-queue: "&c[Login Queue] &fYou are not in the queue. Use &e/join&f to join"
  leave-success: "&a[Login Queue] &fYou left the queue. Use &e/join&f to rejoin"
  threshold-reached: "&c[Login Queue] &fServer &e{server}&f is under heavy load, queueing is paused. Please wait patiently..."
  queue-paused-notify: "&c[Login Queue] &fThe queue has been paused by an administrator, please wait patiently..."
  queue-resumed-notify: "&a[Login Queue] &fThe queue has been resumed, processing your request..."
  authme-please-login-first: "&e[Login Queue] &fPlease log in with &e/login&f or register with &e/register&f before joining the queue"
  menu-disabled: "&c[Login Queue] &fServer selector is disabled. Use &e/join&f to join the default server queue"

  # Command feedback
  command-player-only: "&cThis command can only be executed by a player"
  no-permission: "&cYou do not have permission to use this command"
  player-offline: "&cPlayer &e{player}&f is not online"
  console-specify-player: "&cConsole must specify a player name for this command"
  skipped-player: "&aPlayer &e{player}&f has been let through directly to server &e{server}"
  unknown-subcommand: "&cUnknown subcommand, use &e/mlq help&f for help"
  refreshed: "&aServer status refresh requested"
  queue-paused: "&aThe queue has been paused"
  queue-already-paused: "&cThe queue is already paused"
  queue-resumed-admin: "&aThe queue has been resumed"
  queue-already-running: "&cThe queue is not paused"
  reloaded: "&aConfiguration reloaded"
  send-success: "&aTransfer requested: player &e{player}&f -> server &e{server}"
  carrier-needed: "&cNo online player is available as a message carrier to send this request"
  where-result: "&aPlayer &e{player}&f is currently on server: &e{server}"
  where-offline: "&7Player &e{player}&f is not on any server (possibly offline)"
  ip-result: "&aReal IP of player &e{player}&f: &e{ip}"
  lookup-timeout: "&cLookup timed out: player &e{player}&f may be offline"

  # Status
  status-header: "&6===== Server Status ====="
  status-online: "&aOnline"
  status-offline: "&cOffline"
  status-unknown: "&eChecking"
  server-line-online: "&e{server}&f: &aOnline &7({online}/{max} players, load {ratio}%)"
  server-line-address: "&7  Direct address: &e{address}"
  server-line-latency: "&7  Latency: &e{latency}&f ms &8|&f {version}"
  server-line-offline: "&e{server}&f: &cOffline"
  server-line-unknown: "&e{server}&f: &7Checking status..."
  total-online: "&fTotal online: &e{online}&f/&e{max}"
  status-threshold: "&fRelease threshold: &e{ratio}%"
  status-queue-line: "&f  &e{server}&f queue: &b{size}&f player(s)"
  status-queue-total: "&fTotal queued: &b{size}&f player(s)"
  queue-state-paused: "&cQueue status: Paused"
  queue-state-normal: "&aQueue status: Running normally"
  status-footer: "&6===================="

  # Queue list
  queue-list-header: "&6===== Queue List ====="
  queue-list-server: "&e[{server}]"
  queue-list-empty-server: "&7Queue for {server} is empty"
  queue-list-entry: "&f{position}. &e{name}"
  queue-list-empty: "&7No players are currently queued"
  queue-list-footer: "&6===================="

  # Server selector menu
  server-selector-item-name: "&a{server} &7[{status}]"
  server-selector-status-online: "&7Players online: &a{online}&7/&e{max}"
  server-selector-status-offline: "&cServer is currently offline or unreachable"
  server-selector-status-unknown: "&7Checking server status..."
  server-selector-load: "&7Load: &e{ratio}%"
  server-selector-click-hint: "&fClick to join this server's queue"

  # Help
  help-header: "&6===== MiniLoginQueue Help ====="
  help-join: "&a/mlq join [server] &f- Join the queue (opens selector when multiple servers)"
  help-leave: "&a/mlq leave &f- Leave the current queue"
  help-menu: "&a/mlq menu &f- Open the server selector"
  help-skip: "&a/mlq skip <player> [server] &f- Let a player through directly (skip queue)"
  help-send: "&a/mlq send <player> <server> &f- Transfer any player directly to a server (cross-server)"
  help-where: "&a/mlq where <player> &f- Check which server a player is currently on"
  help-ip: "&a/mlq ip <player> &f- Check a player's real IP"
  help-list: "&a/mlq list [server] &f- View the queue list"
  help-status: "&a/mlq status &f- View server status and queue information"
  help-refresh: "&a/mlq refresh &f- Manually refresh server status"
  help-pause: "&a/mlq pause &f- Pause queue releases"
  help-resume: "&a/mlq resume &f- Resume queue releases"
  help-reload: "&a/mlq reload &f- Reload the configuration"
  help-help: "&a/mlq help &f- Show this help"
  help-footer: "&6=============================="

log-messages:
  plugin-enabled: "MiniLoginQueue enabled"
  plugin-disabled: "MiniLoginQueue disabled"
  authme-not-found: "AuthMe not detected, login verification skipped"
  authme-compat-enabled: "AuthMe integration enabled: unauthenticated players cannot join the queue"
  authme-api-unavailable: "AuthMe API unavailable, login verification skipped"
  selector-mode-enabled: "Multi-server selector mode enabled"
  single-mode-enabled: "Single-server queue mode (server selector disabled)"
  selector-mode-hint: "{count} target servers configured, players can choose via the selector"
